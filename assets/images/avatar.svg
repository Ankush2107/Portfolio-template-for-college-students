<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Circle -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#bgGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.8" />
  
  <!-- Background Shape -->
  <circle cx="200" cy="200" r="170" fill="#0f172a" />
  <circle cx="200" cy="200" r="170" fill="url(#bgGrad)" opacity="0.15" />
  
  <!-- Developer Silhouette / Character -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Hoodie -->
    <path d="M 100 370 C 100 290, 140 260, 200 260 C 260 260, 300 290, 300 370 Z" fill="#1e293b" />
    <!-- Hoodie accent / collar -->
    <path d="M 160 265 L 200 320 L 240 265 C 220 280, 180 280, 160 265 Z" fill="#6366f1" />
    <!-- Head / Neck -->
    <rect x="185" y="220" width="30" height="40" rx="10" fill="#fcd34d" />
    <!-- Face -->
    <ellipse cx="200" cy="180" rx="55" ry="65" fill="#fde68a" />
    <!-- Hair -->
    <path d="M 140 180 C 135 120, 170 100, 200 100 C 240 100, 265 120, 260 180 C 250 140, 225 120, 200 120 C 170 120, 150 145, 140 180 Z" fill="#0f172a" />
    <!-- Modern Glasses -->
    <rect x="160" y="165" width="32" height="22" rx="6" fill="#1e293b" opacity="0.9" stroke="#6366f1" stroke-width="3" />
    <rect x="208" y="165" width="32" height="22" rx="6" fill="#1e293b" opacity="0.9" stroke="#6366f1" stroke-width="3" />
    <line x1="192" y1="176" x2="208" y2="176" stroke="#6366f1" stroke-width="3" />
    <!-- Smile -->
    <path d="M 185 210 Q 200 222 215 210" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
    <!-- Laptop / Tech element -->
    <rect x="130" y="325" width="140" height="45" rx="8" fill="#334155" stroke="#64748b" stroke-width="2" />
    <polygon points="190,340 210,340 205,350 195,350" fill="#38bdf8" />
  </g>
  
  <!-- Floating Code / Tech Badges -->
  <g transform="translate(45, 90)">
    <rect width="65" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="32" y="19" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <g transform="translate(290, 85)">
    <rect width="70" height="30" rx="15" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="35" y="19" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#c084fc" text-anchor="middle">CS '26</text>
  </g>
  
  <g transform="translate(295, 270)">
    <circle cx="20" cy="20" r="18" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
    <text x="20" y="25" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#22c55e" text-anchor="middle">🎓</text>
  </g>
</svg>

