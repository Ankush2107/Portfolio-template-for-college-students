    <rect x="15" y="15" width="120" height="75" rx="6" fill="#022c22" />
    <text x="75" y="58" font-size="28" text-anchor="middle">📐</text>
    <text x="15" y="110" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#f0fdf4">TI-84 Plus CE Silver</text>
    <text x="15" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">$50.00 • Good condition</text>
    <rect x="15" y="145" width="120" height="22" rx="6" fill="#10b981" />
    <text x="75" y="160" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#022c22" text-anchor="middle">Contact Student</text>
  </g>

  <g transform="translate(400, 130)">
    <rect width="150" height="180" rx="10" fill="#064e3b" stroke="#047857" stroke-width="1" />
    <rect x="15" y="15" width="120" height="75" rx="6" fill="#022c22" />
    <text x="75" y="58" font-size="28" text-anchor="middle">🔬</text>
    <text x="15" y="110" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#f0fdf4">Chemistry Lab Coat (M)</text>
    <text x="15" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">$12.00 • Unused</text>
    <rect x="15" y="145" width="120" height="22" rx="6" fill="#10b981" />
    <text x="75" y="160" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#022c22" text-anchor="middle">Contact Student</text>
