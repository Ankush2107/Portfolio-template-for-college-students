<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#cmBg)" rx="16" />
  
  <!-- Browser top -->
  <rect x="30" y="25" width="540" height="30" rx="8" fill="#0f172a" opacity="0.7" />
  <circle cx="50" cy="40" r="5" fill="#ef4444" />
  <circle cx="68" cy="40" r="5" fill="#f59e0b" />
  <circle cx="86" cy="40" r="5" fill="#10b981" />
  <rect x="110" y="32" width="220" height="16" rx="8" fill="#065f46" />
  <text x="120" y="44" font-family="monospace" font-size="10" fill="#a7f3d0">🔒 campusmart.edu/verified-market</text>

  <!-- Marketplace Feed -->
  <rect x="30" y="65" width="540" height="265" rx="8" fill="#022c22" opacity="0.9" />
  
