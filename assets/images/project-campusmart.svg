  <rect x="50" y="80" width="360" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="70" y="101" font-family="system-ui, sans-serif" font-size="12" fill="#a7f3d0">🔍 Search textbooks, lab gear, TI-84 calculators...</text>
