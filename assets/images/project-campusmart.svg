    <text x="15" y="110" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#f0fdf4">CLRS Algorithms 4th Ed.</text>
    <text x="15" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">$35.00 • Like New</text>
    <rect x="15" y="145" width="120" height="22" rx="6" fill="#10b981" />
    <text x="75" y="160" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#022c22" text-anchor="middle">Contact Student</text>
  </g>

  <g transform="translate(225, 130)">
