<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="barActive" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#avBg)" rx="16" />
  
  <!-- Header controls -->
  <rect x="30" y="25" width="540" height="45" rx="8" fill="#1e293b" />
  <rect x="45" y="37" width="110" height="22" rx="4" fill="#3b82f6" />
  <text x="100" y="52" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">Merge Sort (O(n log n))</text>
  
  <rect x="165" y="37" width="70" height="22" rx="4" fill="#334155" />
  <text x="200" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">▶ Play</text>

  <rect x="245" y="37" width="70" height="22" rx="4" fill="#334155" />
  <text x="280" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">↺ Reset</text>
  
  <rect x="450" y="37" width="105" height="22" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="502" y="52" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">Speed: 60 fps</text>

  <!-- Sorting Canvas Visualization Bars -->
  <g transform="translate(45, 90)">
    <rect x="0" y="160" width="18" height="60" rx="3" fill="url(#barGrad)" />
    <rect x="24" y="120" width="18" height="100" rx="3" fill="url(#barGrad)" />
    <rect x="48" y="70" width="18" height="150" rx="3" fill="url(#barGrad)" />
    <rect x="72" y="140" width="18" height="80" rx="3" fill="url(#barGrad)" />
    <rect x="96" y="90" width="18" height="130" rx="3" fill="url(#barGrad)" />
    
    <!-- Active Swapping Bars (highlighted) -->
    <rect x="120" y="40" width="18" height="180" rx="3" fill="url(#barActive)" />
    <rect x="144" y="50" width="18" height="170" rx="3" fill="url(#barActive)" />
    
    <rect x="168" y="110" width="18" height="110" rx="3" fill="url(#barGrad)" />
    <rect x="192" y="30" width="18" height="190" rx="3" fill="url(#barGrad)" />
    <rect x="216" y="150" width="18" height="70" rx="3" fill="url(#barGrad)" />
    <rect x="240" y="80" width="18" height="140" rx="3" fill="url(#barGrad)" />
    <rect x="264" y="20" width="18" height="200" rx="3" fill="url(#barGrad)" />
    <rect x="288" y="130" width="18" height="90" rx="3" fill="url(#barGrad)" />
    <rect x="312" y="60" width="18" height="160" rx="3" fill="url(#barGrad)" />
    <rect x="336" y="170" width="18" height="50" rx="3" fill="url(#barGrad)" />
    <rect x="360" y="100" width="18" height="120" rx="3" fill="url(#barGrad)" />
    <rect x="384" y="45" width="18" height="175" rx="3" fill="url(#barGrad)" />
    <rect x="408" y="15" width="18" height="205" rx="3" fill="url(#barGrad)" />
    <rect x="432" y="115" width="18" height="105" rx="3" fill="url(#barGrad)" />
    <rect x="456" y="85" width="18" height="135" rx="3" fill="url(#barGrad)" />
    <rect x="480" y="135" width="18" height="85" rx="3" fill="url(#barGrad)" />
  </g>

  <!-- Step comparison badge -->
  <g transform="translate(200, 318)">
    <rect width="200" height="24" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1" />
    <text x="100" y="16" font-family="monospace" font-size="11" fill="#fed7aa" text-anchor="middle">Comparing arr[5] &amp; arr[6]</text>
  </g>
</svg>

