<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="shBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#shBg)" rx="16" />
  
  <!-- Terminal window -->
  <rect x="25" y="20" width="550" height="320" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Terminal Top bar -->
  <rect x="25" y="20" width="550" height="34" rx="10" fill="#1e293b" />
  <circle cx="45" cy="37" r="5.5" fill="#ef4444" />
  <circle cx="63" cy="37" r="5.5" fill="#f59e0b" />
  <circle cx="81" cy="37" r="5.5" fill="#10b981" />
  <text x="300" y="42" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">alex@dev-box: ~/projects/mini-shell (c-posix)</text>
  
  <!-- Terminal Output Lines -->
  <g transform="translate(45, 80)" font-family="monospace" font-size="12">
    <text y="0" fill="#38bdf8">alex@dev-box:~$ <tspan fill="#f8fafc">./simpleshell</tspan></text>
    <text y="24" fill="#a855f7">[SimpleShell v1.0.4 - POSIX Process Manager]</text>
    <text y="48" fill="#10b981">mini-sh$ <tspan fill="#f8fafc">cat sample.txt | grep "error" | wc -l &gt; output.log</tspan></text>
    <text y="72" fill="#64748b">[Process Forked: PID 14201, 14202, 14203]</text>
    <text y="96" fill="#64748b">[Pipes Connected: stdin -&gt; pipe0 -&gt; pipe1 -&gt; stdout]</text>
    <text y="120" fill="#10b981">mini-sh$ <tspan fill="#f8fafc">cat output.log</tspan></text>
    <text y="144" fill="#fbbf24">Found 14 instances</text>
    <text y="168" fill="#10b981">mini-sh$ <tspan fill="#f8fafc">valgrind --leak-check=full ./simpleshell</tspan></text>
    <text y="192" fill="#22c55e">==14204== All heap blocks were freed -- no leaks are possible</text>
    <text y="216" fill="#22c55e">==14204== ERROR SUMMARY: 0 errors from 0 contexts (suppressed: 0 from 0)</text>
    <text y="240" fill="#10b981">mini-sh$ <tspan fill="#38bdf8">█</tspan></text>
  </g>
</svg>
